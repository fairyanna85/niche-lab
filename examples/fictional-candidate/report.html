/* niche-lab, v2.1. The report is a journey in five acts: You (supply), The market (demand), Peers (competing supply),
   The verdict, The course. The job market is a night sky: every posting a star, every niche a constellation, the candidate
   a fixed gold point. The same sky opens each act in a new state. Display: Marcellus. Text: Instrument Sans. Italic accents: EB Garamond. Palette: Olympus OS (Intarsia Celeste).
   Sizes are in rem so larger system text scales the whole layout; every grid child may shrink (min-width:0). */
:root,:root[data-theme="light"]{
  /* Olympus OS · Intarsia Celeste: parchment and ivory, bronze and gold, azzurro, celadon, lavanda, rosa.
     Data hues are the moodboard's families taken deep enough to read on ivory (validated: lightness, chroma, CVD, contrast). */
  --bg:#f6f1e7;--bg2:#fffcf6;--bg3:#efe7d8;--ink:#2a241c;--ink2:#5b5245;--ink3:#7f7463;--rule:#e2d7c3;--grid:#ece3d2;
  --h1:#2f5bd0;--h2:#0a8c7e;--h3:#8a5cc4;--h4:#c04a74;--hx:#a99f8e;--gold:#a8792a;--gold2:#8b6a3b;
  --good:#3f7d58;--warn:#a86a00;--crit:#b2453f;--accent:#8b6a3b;--btn:#8b6a3b;--btnink:#fffcf6;
  --shadow:0 1px 0 rgba(120,96,60,.06),0 10px 28px -18px rgba(120,96,60,.35);
  --serif:"Marcellus","Cormorant Garamond",Georgia,serif;--sans:"Instrument Sans","Helvetica Neue",Arial,sans-serif;--ital:"EB Garamond",Georgia,serif;
  --bar:3.5rem;--sel:0rem;--botbar:0rem;--r:14px;--gap:1.25rem;
}
:root[data-theme="dark"]{
  --bg:#161922;--bg2:#1e2230;--bg3:#262b3b;--ink:#f2eadb;--ink2:#cbc2b0;--ink3:#9a917f;--rule:#343a4e;--grid:#2a3042;
  --h1:#5a84ea;--h2:#1c9e90;--h3:#8f7ae6;--h4:#d66a7c;--hx:#6b7596;--gold:#d9b46a;--gold2:#c09a4e;
  --good:#5fbf86;--warn:#e0a43a;--crit:#e2555e;--accent:#d9b46a;--btn:#d9b46a;--btnink:#1b1a12;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 14px 34px -22px rgba(0,0,0,.7);
}
*,*::before,*::after{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.55 var(--sans);-webkit-font-smoothing:antialiased;overflow-wrap:break-word;padding-bottom:var(--botbar)}
h1,h2,h3,h4{font-family:var(--serif);font-weight:400;margin:0;line-height:1.12;letter-spacing:0;text-wrap:balance}
p{margin:0}a{color:var(--accent)}button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
.wrap{max-width:75rem;margin:0 auto;padding:0 clamp(1rem,3.5vw,2.75rem)}
.meta{font-size:.875rem;color:var(--ink3);line-height:1.45}
.muted{color:var(--ink2)}.serif{font-family:var(--serif)}
.anywhere{overflow-wrap:anywhere}
[id]{scroll-margin-top:calc(var(--bar) + var(--sel) + .5rem)}

/* ---------- station bar: five equal stations, never scrolls ---------- */
.stations{position:fixed;inset:0 0 auto 0;z-index:50;height:var(--bar);background:color-mix(in srgb,var(--bg2) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid color-mix(in srgb,var(--rule) 70%,transparent)}
.stations ol{list-style:none;margin:0 auto;padding:0 clamp(.25rem,3.5vw,2.75rem);max-width:75rem;height:100%;display:grid;grid-template-columns:repeat(5,1fr)}
.stations li{display:flex}
.stations a{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;min-height:2.75rem;text-decoration:none;color:var(--ink3);font-size:.8125rem;line-height:1.15;text-align:center;padding:.25rem .125rem}
.stations a b{font-family:var(--serif);font-weight:400;font-size:.8125rem;color:var(--ink3)}
.stations a span{font-size:.875rem}
.stations a::after{content:"";position:absolute;left:18%;right:18%;bottom:0;height:2px;background:var(--rule);transform-origin:left;transform:scaleX(1);opacity:0}
.stations a i{position:absolute;left:18%;bottom:0;height:2px;width:calc(64% * var(--p,0));background:var(--gold)}
.stations a[aria-current]{color:var(--ink)}.stations a[aria-current] b{color:var(--gold)}.stations a[aria-current]::after{opacity:1}
@media (min-width:860px){.stations a{flex-direction:row;gap:.5rem;font-size:.9375rem}.stations a span{font-size:.9375rem}}
@media (max-width:859.98px){
  :root{--bar:0rem;--botbar:calc(3.5rem + env(safe-area-inset-bottom))}
  .stations{inset:auto 0 0 0;height:var(--botbar);padding-bottom:env(safe-area-inset-bottom);border-bottom:0;border-top:1px solid color-mix(in srgb,var(--rule) 70%,transparent)}
  .stations ol{height:3.5rem}
  .stations a::after,.stations a i{bottom:auto;top:0}
  body.typing .stations{display:none}
}
.corner{position:fixed;z-index:51;right:max(.75rem,env(safe-area-inset-right));bottom:1rem;width:2.75rem;height:2.75rem;border-radius:50%;border:1px solid var(--rule);background:var(--bg2);color:var(--ink2);cursor:pointer;display:grid;place-items:center}
.corner svg{width:1.25rem;height:1.25rem}.corner .moon{display:none}:root[data-theme="light"] .corner .moon{display:block}:root[data-theme="light"] .corner .sun{display:none}
@media (max-width:859.98px){.corner{position:absolute;bottom:auto;top:max(.75rem,env(safe-area-inset-top))}}

/* ---------- niche selector: sticky through acts 2–5 ---------- */
.scope{--sel:3rem}
.selector{position:sticky;top:var(--bar);z-index:40;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--rule)}
.selector .wrap{display:flex;align-items:center;gap:.75rem;min-height:var(--sel);padding-top:.25rem;padding-bottom:.25rem}
.selector .lbl{font-size:.875rem;color:var(--ink3);white-space:nowrap}
.selector [data-btn-group]{flex:1;--min:9rem}
.selector .seg button{min-height:2.25rem;padding:.25rem .5rem;font-size:.875rem;line-height:1.2;border-radius:10px;border:1px solid var(--rule);background:transparent;color:var(--ink2);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:.4rem;text-align:center}
.selector .seg button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);background:var(--bg3)}
.selector .seg button i,.pick i,.sheet-list i{width:.6rem;height:.6rem;border-radius:50%;flex:none;display:inline-block}
.pick{width:100%;min-height:2.75rem;display:flex;align-items:center;gap:.6rem;padding:.25rem .75rem;border:1px solid var(--rule);border-radius:10px;background:var(--bg2);color:var(--ink);cursor:pointer;text-align:left;font-size:.9375rem;line-height:1.25}
.pick .chev{margin-left:auto;color:var(--ink3);flex:none}
.selector .seg{display:none}.selector .pickwrap{display:block;flex:1}
@media (min-width:860px){.selector.few .seg{display:grid}.selector.few .pickwrap{display:none}}
dialog.sheet-dlg{border:1px solid var(--rule);border-radius:16px;background:var(--bg2);color:var(--ink);padding:1rem;width:min(36rem,calc(100vw - 2rem));max-height:80vh}
dialog.sheet-dlg::backdrop{background:rgba(5,8,20,.6)}
dialog.sheet-dlg h3{font-family:var(--sans);font-weight:600;font-size:1rem;margin-bottom:.75rem}
.sheet-list{--cols:1}
.sheet-list button{min-height:3rem;display:flex;align-items:center;gap:.6rem;text-align:left;padding:.5rem .75rem;border-radius:10px;border:1px solid var(--rule);background:transparent;color:var(--ink);cursor:pointer;line-height:1.3}
.sheet-list button[aria-pressed="true"]{border-color:var(--gold)}

/* ---------- buttons: one component; groups make sibling widths and heights equal by construction ---------- */
[data-btn-group]{display:grid;gap:.5rem;grid-template-columns:repeat(var(--cols,auto-fit),minmax(min(100%,var(--min,10rem)),1fr));align-items:stretch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:2.75rem;padding:.4rem .9rem;border:1px solid var(--rule);background:var(--bg2);color:var(--ink);border-radius:10px;cursor:pointer;font-size:.9375rem;line-height:1.2;text-align:center;text-decoration:none}
.btn:hover{border-color:var(--ink3)}.btn.ok{border-color:var(--good);color:var(--good)}
.btn.primary{background:var(--btn);color:var(--btnink);border-color:var(--btn)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
[data-action="copy"]{width:6.5rem;flex:none}
@media (min-width:860px){.btn{min-height:2.25rem}}
.lnk{display:inline-flex;align-items:center;min-height:2.75rem}

/* ---------- acts ---------- */
.act{position:relative}
.act + .act,.scope > .act{border-top:1px solid var(--rule)}
.chead{padding:clamp(2.5rem,6vw,4.5rem) 0 1.5rem;display:grid;gap:.75rem;max-width:46rem}
.chead .no{font-family:var(--serif);font-size:.875rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold2);display:flex;gap:.6rem;align-items:baseline}
.chead .no span{color:var(--gold2)}
.chead h2{font-size:clamp(1.75rem,3.2vw,2.5rem);line-height:1.12;font-weight:400}
.chead .ans{font-family:var(--ital);font-style:italic;font-size:clamp(1.0625rem,1.6vw,1.25rem);line-height:1.4;color:var(--ink2);font-weight:400;max-width:42rem}
.body{display:grid;gap:var(--gap);padding-bottom:2rem}
.learned{border-top:1px solid var(--rule);padding:1.75rem 0 2.5rem;display:grid;gap:1.25rem;grid-template-columns:minmax(0,1fr)}
@media (min-width:860px){.learned{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);align-items:end}}
.learned ul{margin:0;padding:0;list-style:none;display:grid;gap:.6rem}
.learned li{padding-left:1rem;border-left:2px solid var(--gold);font-size:1rem}
.handover{display:grid;gap:.75rem;justify-items:start}
.handover p{font-family:var(--ital);font-style:italic;font-weight:400;font-size:1.375rem;line-height:1.3}
.next{display:inline-flex;align-items:center;gap:.5rem;min-height:2.75rem;padding:.35rem 1.1rem;font-size:.9375rem;letter-spacing:.01em;border-radius:999px;border:1px solid var(--btn);background:var(--btn);color:var(--btnink);text-decoration:none;font-weight:500;box-shadow:var(--shadow)}
.next::after{content:"→"}
.next:hover{filter:brightness(1.06)}

/* ---------- panels, figures, evidence ---------- */
.panel{background:var(--bg2);border:1px solid var(--rule);border-radius:var(--r);padding:1.25rem 1.25rem 1.1rem;box-shadow:var(--shadow)}
.panel > h3{font-family:var(--serif);font-weight:400;font-size:1.25rem;line-height:1.25;margin-bottom:.3rem}
.fh{font-family:var(--serif);font-weight:400;font-size:.8125rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold2);line-height:1.4;margin-bottom:.3rem}
.panel > .d{font-size:1rem;color:var(--ink2);margin-bottom:.9rem}
@media (min-width:860px){.panel > .d{font-size:.9375rem}}
.panel > .foot{margin-top:.75rem}
.g2{display:grid;gap:var(--gap);grid-template-columns:repeat(auto-fit,minmax(min(100%,26rem),1fr));align-items:stretch}
.g2 > .per-niche{display:grid}.g2 > .per-niche > *{height:100%}
.g3{display:grid;gap:var(--gap);grid-template-columns:repeat(auto-fit,minmax(min(100%,18rem),1fr));align-items:start}
.do{border-left:2px solid var(--gold);padding:.1rem 0 .1rem .8rem;margin-top:.9rem}
.do b{display:block;font-size:.875rem;color:var(--gold);font-weight:600;margin-bottom:.15rem}
.do ul{margin:0;padding-left:1.1rem}.do li{margin:.2rem 0}
.body > .do,.per-niche > .do{margin:0 1.2rem}
details.evidence{border:1px solid var(--rule);border-radius:var(--r);background:color-mix(in srgb,var(--bg2) 55%,transparent)}
details.evidence > summary{list-style:none;cursor:pointer;min-height:3.25rem;display:flex;align-items:center;gap:.75rem;padding:.6rem 1.1rem;font-weight:500}
details.evidence > summary::-webkit-details-marker{display:none}
details.evidence > summary::before{content:"+";font-family:var(--serif);font-size:1.4rem;line-height:1;color:var(--gold);width:1rem}
details.evidence[open] > summary::before{content:"–"}
details.evidence > summary .meta{margin-left:auto;text-align:right;white-space:nowrap;flex:none}
details.evidence > .inner{padding:0 1.1rem 1.1rem;display:grid;gap:var(--gap)}
details.tool > summary{min-height:4rem}
details.tool > summary .t{display:grid}details.tool > summary .t small{font-size:.875rem;color:var(--ink3);font-weight:400}
.stub{border:1px dashed var(--rule);border-radius:var(--r);padding:.9rem 1.1rem;color:var(--ink3);font-size:.9375rem}
.stub b{color:var(--ink2);font-weight:500}
.tag{display:inline-block;font-size:.8125rem;color:var(--ink2);border:1px solid var(--rule);border-radius:6px;padding:0 .4rem;line-height:1.6;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:.35rem}
.v{display:inline-flex;align-items:center;gap:.4rem;font-size:.875rem;color:var(--ink2)}.v i{width:.55rem;height:.55rem;border-radius:50%;background:var(--ink3)}
.st{font-size:.875rem}.st.pass,.st.live,.st.proven,.st.stated{color:var(--good)}.st.fail,.st.likely_ghost,.st.gap,.st.absent{color:var(--crit)}.st.warn,.st.doubtful,.st.inferred1{color:var(--warn)}.st.not_run,.st.minor{color:var(--ink3)}.st.inferred2,.st.partial{color:var(--ink2)}
.ph{background:color-mix(in srgb,var(--gold) 22%,transparent);border-radius:3px;padding:0 3px}
.ph.filled{background:color-mix(in srgb,var(--good) 22%,transparent)}
.statement{font-family:var(--ital);font-weight:400;font-style:italic;font-size:clamp(1.25rem,2.2vw,1.75rem);line-height:1.3;max-width:40ch}
.qa{padding:.6rem 0;border-bottom:1px solid var(--rule)}.qa:last-child{border-bottom:0}.qa b{font-weight:500;display:block}
.tiles{display:grid;gap:.25rem 1.25rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,7.5rem),1fr))}
.tile b{display:block;font-family:var(--serif);font-weight:400;font-size:1.875rem;line-height:1.05;color:var(--gold2)}.tile span{font-size:.875rem;color:var(--ink3)}

/* ---------- tables: rows become stacked cards under 640 px ---------- */
table.t{width:100%;border-collapse:collapse;font-size:.9375rem}
table.t th{font-weight:500;font-size:.875rem;color:var(--ink3);text-align:left;padding:0 .75rem .5rem 0;border-bottom:1px solid var(--ink3)}
table.t td{padding:.6rem .75rem .6rem 0;border-bottom:1px solid var(--rule);vertical-align:top}
table.t td.r,table.t th.r{text-align:right}
@media (max-width:639.98px){
  table.t,table.t tbody,table.t tr,table.t td{display:block;width:100%}
  table.t tr:first-child:has(th){display:none}
  table.t tr{padding:.6rem 0;border-bottom:1px solid var(--rule)}
  table.t td{border:0;padding:.15rem 0;display:grid;grid-template-columns:minmax(0,7.5rem) minmax(0,1fr);gap:.75rem;text-align:left!important}
  table.t td::before{content:attr(data-label);font-size:.875rem;color:var(--ink3)}
  table.t td[data-label=""]{grid-template-columns:minmax(0,1fr)}table.t td[data-label=""]::before{display:none}
}

/* ---------- sky openers ---------- */
.opener{position:relative;display:grid;grid-template-columns:minmax(0,calc(max(0px,(100vw - 75rem) / 2) + 26rem)) minmax(0,1fr)}
.opener .stage{position:sticky;top:calc(var(--bar) + var(--sel));height:min(calc(100vh - var(--bar) - var(--sel)),44rem);grid-column:2;grid-row:1;overflow:hidden}
.opener .steps{grid-column:1;grid-row:1;padding:0 0 0 calc(max(0px,(100vw - 75rem) / 2) + clamp(1rem,3.5vw,2.75rem));position:relative;z-index:2}
.opener .step{min-height:min(40vh,22rem);display:flex;align-items:center;padding:2rem 0}
.opener .step:first-child{min-height:min(36vh,20rem)}
.opener .step:only-child{min-height:min(40vh,24rem)}
.opener .card{background:var(--bg2);border:1px solid var(--rule);border-radius:var(--r);padding:1.25rem 1.25rem 1.1rem;width:100%;box-shadow:var(--shadow)}
.opener .card h3{font-size:clamp(1.25rem,2vw,1.625rem);margin-bottom:.6rem}
.opener .card p{color:var(--ink2)}
.legend{display:flex;flex-wrap:wrap;gap:.35rem 1rem;font-size:.875rem;color:var(--ink2);margin:.75rem 0 0}
.legend span{display:inline-flex;align-items:center;gap:.4rem}.legend i{width:.6rem;height:.6rem;border-radius:50%;display:inline-block;flex:none}
.sky{display:block;width:100%;height:100%}
.sky .star{transition:fill .7s ease,r .7s ease,opacity .7s ease}
.sky .constellation{transition:opacity .7s ease}
.plates{display:none}
.opener .plate{display:none}
@media (max-width:859.98px){
  .opener{display:block}
  .opener .stage{display:none}
  .opener .steps{padding:0 clamp(1rem,3.5vw,2.75rem)}
  .opener .step,.opener .step:first-child,.opener .step:only-child{min-height:0;display:grid;gap:.5rem;padding:0 0 1.25rem}
  .opener .plate{display:block}.opener .plate svg{display:block;width:100%;height:auto}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}.sky .star,.sky .constellation{transition:none}
  .opener{display:block}.opener .stage{display:none}.opener .steps{padding:0 clamp(1rem,3.5vw,2.75rem);margin:0}
  .opener .step,.opener .step:first-child,.opener .step:only-child{min-height:0;padding:1rem 0;display:grid;gap:1rem}
  .opener .plate{display:block}.opener .plate svg{display:block;width:100%;height:auto}
}

/* ---------- cover: a measured title page, not a poster ----------
   Three bands on one grid: title and chart side by side, a ledger of the study's counts, the route as five links. */
.cover{padding:calc(var(--bar) + clamp(1.75rem,5vh,3.5rem)) 0 clamp(1.5rem,4vh,2.5rem)}
.cover .head{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:clamp(1.5rem,4vw,3.5rem);align-items:center}
.cover .front{display:grid;gap:1rem;max-width:36rem}
.cover .who{font-size:.9375rem;color:var(--ink3)}
.cover h1{font-size:clamp(2rem,3.6vw,3rem);font-weight:400;line-height:1.08}
.cover .ans{font-size:1.0625rem;color:var(--ink2);max-width:34rem}
.cover .go{display:flex;flex-wrap:wrap;gap:.75rem 1.25rem;align-items:center;margin-top:.25rem}
.cover .stage{position:relative;width:100%;max-width:28rem;aspect-ratio:1;justify-self:end;overflow:hidden}
.cover .tiles{display:grid;grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:0;margin-top:clamp(1.75rem,4vh,2.75rem);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.cover .tile{padding:.85rem 1rem .9rem;border-left:1px solid var(--rule);display:grid;gap:.2rem;align-content:start}
.cover .tile:first-child{border-left:0;padding-left:0}
.cover .tile b{font-size:1.625rem;line-height:1;color:var(--gold2)}
.cover .tile span{font-size:.8125rem;line-height:1.35;color:var(--ink3)}
.route{margin-top:1.5rem}
.route ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:0}
.route li:not(:first-child){padding-left:1rem}
.route .stop{display:grid;gap:.2rem;padding:.7rem 0 .5rem;border-top:2px solid var(--rule)}
.route .stop b{font-family:var(--serif);font-weight:400;color:var(--gold2);font-size:1rem}
.route .stop span{font-size:.875rem;line-height:1.4;color:var(--ink2)}
@media (max-width:859.98px){
  .cover{padding-top:calc(var(--bar) + 1rem)}
  .cover .head{grid-template-columns:minmax(0,1fr);gap:.75rem}
  .cover .stage{order:-1;max-width:none;aspect-ratio:auto;height:8.5rem;justify-self:stretch}
  .cover h1{font-size:1.75rem;line-height:1.12}
  .cover .front{gap:.75rem}
  .cover .tiles{grid-auto-flow:row;grid-template-columns:minmax(0,1fr);margin-top:1.5rem;border-bottom:0}
  .cover .tile,.cover .tile:first-child{grid-template-columns:3.75rem minmax(0,1fr);align-items:baseline;gap:.75rem;padding:.45rem 0;border-left:0;border-bottom:1px solid var(--rule)}
  .cover .tile b{font-size:1.25rem}
  .cover .tile span{font-size:.875rem;color:var(--ink2)}
  .route ol{grid-auto-flow:row;grid-template-columns:minmax(0,1fr)}
  .route li:not(:first-child){padding-left:0}
  .route .stop{padding:.6rem 0;border-top-width:1px}
}
@media (min-width:560px) and (max-width:859.98px){
  .cover .tiles{grid-auto-flow:column;grid-template-columns:none;border-bottom:1px solid var(--rule)}
  .cover .tile,.cover .tile:first-child{grid-template-columns:none;gap:.15rem;padding:.6rem .75rem;border-bottom:0;border-left:1px solid var(--rule)}
  .cover .tile:first-child{border-left:0;padding-left:0}
  .route .stop{grid-template-columns:9.5rem minmax(0,1fr);align-items:baseline;gap:1rem}
}

/* ---------- chart kit ---------- */
.chart{width:100%}
.kit{display:grid;gap:.15rem}
.kit .row{display:grid;grid-template-columns:var(--lab,minmax(0,38%)) minmax(0,1fr) var(--val,auto);gap:.25rem 12px;align-items:center;padding:.2rem 0}
.kit .row .lab{font-size:.9375rem;line-height:1.3;overflow-wrap:anywhere}
.kit .row .val{font-size:.875rem;color:var(--ink2);text-align:right;white-space:nowrap}
.kit .row svg{display:block;width:100%;overflow:visible}
.kit.narrow .row{grid-template-columns:minmax(0,1fr) var(--val,auto)}
.kit.narrow .row .lab{grid-column:1 / -1}
.kit .axis{display:grid;grid-template-columns:var(--lab,minmax(0,38%)) minmax(0,1fr) var(--val,auto);gap:12px}
.kit.narrow .axis{grid-template-columns:minmax(0,1fr) var(--val,auto)}
.kit.narrow .axis > :first-child{display:none}
.kit .axis svg{display:block;width:100%}
svg text{font-family:var(--sans);font-size:13px;fill:var(--ink2)}
svg .ink{fill:var(--ink)}svg .ser{font-family:var(--serif)}
.matrix{display:grid;gap:2px;align-items:center}
.matrix .mh{font-size:.875rem;color:var(--ink2);text-align:center;display:flex;flex-direction:column;align-items:center;gap:.15rem;padding-bottom:.25rem}
.matrix .mh i{width:.6rem;height:.6rem;border-radius:50%;display:block}
.matrix .ml{font-size:.9375rem;line-height:1.3;padding:.2rem .5rem .2rem 0;overflow-wrap:anywhere}
.matrix .mc{height:1.5rem;border-radius:4px;position:relative}
.matrix .mc.req::after{content:"";position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2.5px;border-radius:50%;background:var(--bg)}
.matrix .yc{display:grid;place-items:center}
.matrix .yc i{width:.85rem;height:.85rem;border-radius:50%;border:1.5px solid var(--gold);display:block}
.matrix .yc i.p2{background:color-mix(in srgb,var(--gold) 60%,transparent)}.matrix .yc i.p3{background:var(--gold)}
.matrix.narrow .ml{grid-column:1 / -1;padding-top:.5rem}
.ribbon{display:grid;grid-template-columns:3rem minmax(0,1.2fr) minmax(0,2fr) auto;gap:.9rem;align-items:center;padding:.75rem 0;border-bottom:1px solid var(--rule)}
.ribbon:last-child{border-bottom:0}
.ribbon .bars{display:flex;height:.75rem;background:var(--grid);border-radius:4px;overflow:hidden;gap:2px}
.ribbon .bars i{display:block;height:100%}
.ribbon .sc{font-family:var(--serif);font-size:1.75rem;font-weight:400;text-align:right;white-space:nowrap;min-width:max-content}
@media (max-width:639.98px){.ribbon{grid-template-columns:2.5rem minmax(0,1fr) auto}.ribbon .bars{grid-column:1 / -1}.ribbon .sc{font-size:1.5rem}}
.linkd{display:grid;align-items:start}
.linkd .lcol,.linkd .rcol{display:grid;gap:.6rem}
.linkd .li{font-family:var(--serif);font-size:1.125rem;line-height:1.3;padding:.3rem .5rem .3rem 0;border-right:2px solid var(--gold)}
.linkd .ri{font-size:.9375rem;line-height:1.3;padding:.2rem 0 .2rem .6rem;border-left:2px solid var(--rule)}
.linkd .mid svg{display:block;overflow:visible}
.pairs{display:grid;gap:1rem}.pair .pl{font-family:var(--serif);font-size:1.125rem;line-height:1.3;border-left:2px solid var(--gold);padding-left:.6rem}
.pair ul{list-style:none;margin:.35rem 0 0;padding:0 0 0 .8rem}.pair li{margin:.2rem 0}.pair .arrow{color:var(--gold)}
.finds{display:grid;gap:var(--gap);grid-template-columns:repeat(auto-fit,minmax(min(100%,18rem),1fr))}
.find{border-top:2px solid var(--gold);padding-top:.75rem}.find b{display:block;font-family:var(--serif);font-weight:400;font-size:1.1875rem;line-height:1.2;margin-bottom:.35rem}
.gantt{display:grid;gap:6px 3px;align-items:stretch}
.gantt .gw{font-size:.8125rem;color:var(--ink3);text-align:center}
.gantt .gt{font-size:.9375rem;line-height:1.3;align-self:center;padding:.35rem .75rem .35rem 0;border-top:1px solid var(--rule)}
.gantt .gc{border-top:1px solid var(--rule);border-left:1px dashed color-mix(in srgb,var(--rule) 60%,transparent)}
.gantt .gb{background:var(--gold);border-radius:999px;height:.75rem;align-self:center;margin:0 2px;opacity:.9}
.glist{display:grid;gap:.6rem}.glist .gi{border-left:3px solid var(--gold);padding:.2rem 0 .2rem .7rem}.glist b{font-family:var(--serif);font-weight:400}
.rare{display:grid;gap:.4rem;margin-top:1.1rem}.rare p{font-size:1.0625rem}.rare b{color:var(--gold);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}.chip{border:1px solid var(--rule);border-radius:999px;padding:.2rem .7rem;font-size:1rem;font-style:italic;font-family:var(--ital);background:var(--bg2)}
.formula{border-top:1px solid var(--rule);padding:.8rem 0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.4rem 1rem;align-items:start}
.formula .tpl{font-family:var(--serif);font-size:1.25rem;line-height:1.3}.formula .ex{grid-column:1 / -1}
.heat{display:grid;gap:3px}
.heat > div{min-height:2.25rem;border-radius:5px;display:grid;place-items:center;font-size:.875rem}
.heat .hh{min-height:1.5rem;color:var(--ink3);background:none}

/* ---------- act 1: you ---------- */
.career{display:grid;gap:1rem}
.roles{display:grid;gap:.75rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,15rem),1fr))}
.role{border-left:var(--w,3px) solid var(--gold);padding:.2rem 0 .2rem .8rem}
.role b{display:block;font-weight:500}.role .meta{display:block}
.fields{display:grid;gap:0 1.5rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,22rem),1fr))}
.field{display:grid;grid-template-columns:minmax(0,9rem) minmax(0,1fr);gap:.75rem;padding:.55rem 0;border-bottom:1px solid var(--rule)}
.field .k{font-size:.875rem;color:var(--ink3)}
.field .vv{display:grid;gap:.15rem}
.grade{font-size:.875rem}
@media (max-width:479.98px){.field{grid-template-columns:minmax(0,1fr);gap:.1rem}}
.edge{border-top:2px solid var(--gold);padding-top:.6rem}
.edges .fh{margin-bottom:.75rem}
.edge b{font-family:var(--serif);font-weight:400;font-size:clamp(1.1875rem,1.8vw,1.4375rem);display:block;line-height:1.2;margin-bottom:.4rem}

/* ---------- verdict plates ---------- */
.plates-v{display:grid;gap:var(--gap);grid-template-columns:repeat(auto-fit,minmax(min(100%,24rem),1fr))}
.plate-v{background:var(--bg2);border:1px solid var(--rule);border-radius:18px;padding:1.25rem;display:grid;grid-template-columns:9rem minmax(0,1fr);gap:1.1rem;align-items:center}
.plate-v .rank{font-size:.875rem;color:var(--ink3)}
.plate-v h3{font-size:1.5rem;margin:.2rem 0 .5rem}
.plate-v .score{font-family:var(--serif);font-size:2.75rem;font-weight:400;line-height:1}
@media (max-width:519.98px){.plate-v{grid-template-columns:minmax(0,1fr)}.plate-v .glyph{max-width:9rem}}
.glyph svg{width:100%;height:auto;display:block}

/* ---------- course: actions, playbook, resumes, linkedin, tracker ---------- */
.actlist{display:grid}
.act-row{display:grid;grid-template-columns:2.75rem minmax(0,1fr);gap:.5rem;align-items:start;padding:.4rem 0;border-bottom:1px solid var(--rule)}
.check{width:2.75rem;height:2.75rem;display:grid;place-items:center;cursor:pointer}
.check input{width:1.25rem;height:1.25rem;accent-color:var(--gold);margin:0}
.act-row .txt{padding-top:.6rem}.act-row.done .txt{color:var(--ink3);text-decoration:line-through}
.act-row .tags{margin-top:.35rem}
.imp-high{border-color:var(--gold);color:var(--gold)}
.progress{height:6px;border-radius:3px;background:var(--grid);overflow:hidden;margin:.75rem 0 .25rem}.progress i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}
.weeks{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,12rem),1fr));gap:.75rem}
.week{background:var(--bg3);border-radius:10px;border-top:2px solid var(--gold);padding:.75rem .9rem}
.week b{font-family:var(--serif);font-weight:400;font-size:1.125rem;display:block;margin-bottom:.25rem}.week ul{margin:0;padding-left:1.1rem}
.res{display:grid;grid-template-columns:minmax(0,20rem) minmax(0,1fr);gap:1.75rem}
@media (max-width:899.98px){.res{grid-template-columns:minmax(0,1fr)}}
.vlist{--cols:1}
.vlist button{min-height:2.75rem;text-align:left;justify-content:flex-start;padding:.4rem .75rem;border-radius:10px;border:1px solid var(--rule);background:transparent;color:var(--ink2);cursor:pointer;line-height:1.3;display:flex;align-items:center}
.vlist button[aria-selected="true"]{color:var(--ink);border-color:var(--ink);background:var(--bg3)}
.ph-field{display:grid;gap:.25rem;margin:.6rem 0}.ph-field label{font-size:.875rem;color:var(--ink3);overflow-wrap:anywhere}
input[type=text],select{background:var(--bg3);border:1px solid var(--rule);color:var(--ink);border-radius:8px;padding:.5rem .6rem;min-height:2.75rem;font-size:1rem;width:100%}
@media (min-width:860px){input[type=text],select{font-size:.9375rem;min-height:2.25rem}}
.ph-fields{max-height:24rem;overflow-y:auto;padding-right:.25rem}
.paper{background:#fdfcf9;color:#1b2033;border-radius:4px;padding:clamp(1.1rem,4.5vw,3.25rem);box-shadow:0 30px 80px -40px rgba(0,0,0,.6)}
:root[data-theme="light"] .paper{box-shadow:0 1px 0 var(--rule),0 24px 60px -36px rgba(20,28,58,.45)}
.paper .nm{font-family:var(--serif);font-size:2rem;font-weight:400}.paper .hl{font-weight:600;margin-top:.25rem}.paper .ct{font-size:.875rem;color:#4c5672;overflow-wrap:anywhere}
.paper h4{font-family:var(--sans);font-size:.875rem;font-weight:600;color:#2f5bd0;margin:1.25rem 0 .4rem;padding-bottom:.2rem;border-bottom:1px solid #dde1ec}
.paper .role2{display:flex;justify-content:space-between;flex-wrap:wrap;gap:.25rem .75rem;margin-top:.75rem}.paper .role2 span{color:#4c5672;font-size:.875rem}
.paper .ctx,.paper .scope{font-size:.875rem;color:#4c5672}.paper .ctx{font-style:italic}
.paper ul{margin:.4rem 0 0;padding-left:1.1rem}.paper li{margin:.2rem 0}
.paper .ph{background:#f6e7b9}.paper .ph.filled{background:#d6f0de}
.paper .src{font-size:.75rem;color:#5f6884;border-color:#dde1ec;margin-left:.35rem;line-height:1.4}
.li-field{background:var(--bg2);border:1px solid var(--rule);border-radius:12px;padding:.9rem 1rem;margin-bottom:.75rem}
.li-field .top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.5rem .75rem;align-items:center;margin-bottom:.5rem}
.li-field .top b{font-weight:500}.li-field pre{white-space:pre-line;font:inherit;margin:0;color:var(--ink);overflow-wrap:anywhere}
.trk{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,11rem),1fr));gap:.6rem;align-items:end}
.trk label{font-size:.875rem;color:var(--ink3);display:grid;gap:.25rem}
#trk-diag .hit{border-left:2px solid var(--crit);padding:.4rem .7rem;margin-top:.6rem}
.emp{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.25rem .75rem;padding:.75rem 0;border-bottom:1px solid var(--rule);align-items:start}
.emp:last-child{border-bottom:0}
.emp .co{font-weight:500;overflow-wrap:anywhere}.emp .acts{display:flex;gap:.5rem;align-items:center}
.dots{color:var(--gold);letter-spacing:2px}
details.more > summary{cursor:pointer;color:var(--accent);list-style:none}details.more > summary::-webkit-details-marker{display:none}
.erow{display:flex;flex-wrap:wrap;align-items:center;gap:0 1rem}
.per-niche > .do,.per-niche + .do{margin-top:var(--gap)}
.panel ol{padding-left:1.75rem!important}
.pitch{border-top:2px solid var(--gold);padding:1.1rem 0 .4rem}.pitch .statement{max-width:none;margin-top:.4rem}
.running{display:flex;flex-wrap:wrap;gap:.75rem 1.5rem;align-items:center}.running .r{display:flex;gap:.6rem;align-items:center}.running .r svg{width:3rem;height:3rem}

#tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--bg);font-size:.875rem;line-height:1.4;padding:.45rem .65rem;border-radius:8px;max-width:19rem;opacity:0;transition:opacity .08s}
footer{padding:1.75rem 0 3.5rem;border-top:1px solid var(--rule)}

/* ---------- phone type scale (v2.1.1): denser, after reader feedback that 2.1.0 was too large to read ---------- */
@media (max-width:859.98px){
  
  body{line-height:1.5}
  .chead{padding:2.25rem 0 1.25rem;gap:.5rem}
  .chead h2{font-size:1.625rem;line-height:1.15}

  .tile b{font-size:1.375rem}
  .statement{font-size:1.125rem;line-height:1.34}
  .opener .card h3{font-size:1.25rem}
  .opener .card{padding:1rem}
  .handover p{font-size:1.125rem}
  .edge b,.find b{font-size:1.125rem}
  .linkd .li,.pair .pl,.week b{font-size:1rem}
  .paper .nm{font-size:1.5rem}
  .panel{padding:.9rem .9rem .8rem}
  .panel > h3,.fh{font-size:.9375rem}
  .panel > .d{font-size:.9375rem}
  .stations a span{font-size:.8125rem}.stations a b{font-size:.75rem}
  input[type=text],select{font-size:16px}

}

text": "Ranks 2–4 are within 3 points and swap under other weights; treat them as a cluster, not a strict order.", "impact": "medium", "effort": "medium", "section": "portfolio", "niche_id": null, "id": "a019"}, {"text": "Log every approach: niche, employer, channel (warm or cold), date, reply, stage. Review weekly against the diagnosis table.", "impact": "medium", "effort": "medium", "section": "funnel", "niche_id": null, "id": "a020"}, {"text": "Lead with the $18M partner-sourced figure: partner-sourced revenue is required in 7 of 10 postings.", "impact": "medium", "effort": "medium", "section": "demand", "niche_id": "n02", "id": "a021"}, {"text": "Add co-sell evidence before applying; it is required in half the postings.", "impact": "medium", "effort": "medium", "section": "demand", "niche_id": "n02", "id": "a022"}, {"text": "Name the forecast mechanism and the C-suite audience: 'forecast' and 'suite' are among the most niche-specific terms.", "impact": "medium", "effort": "medium", "section": "language", "niche_id": "n02", "id": "a023"}, {"text": "Five of the six gaps are about unstated facts (co-sell, forecasting, C-suite, stage). Fill them before applying; coverage would move from 0.57 to about 0.86.", "impact": "medium", "effort": "medium", "section": "fit", "niche_id": "n02", "id": "a024"}, {"text": "Start with TripleLift, Braze, Amperity and Subtotal: live postings plus an agency or AWS ecosystem path.", "impact": "medium", "effort": "medium", "section": "employers", "niche_id": "n02", "id": "a025"}, {"text": "Skip the agency-posted 'Confidential (martech)' listing unless the employer can be identified.", "impact": "medium", "effort": "medium", "section": "employers", "niche_id": "n02", "id": "a026"}, {"text": "Ask a holding-company agency contact for an introduction to the partnerships lead at each martech target; agencies sit on both sides of these deals.", "impact": "medium", "effort": "medium", "section": "access", "niche_id": "n02", "id": "a027"}, {"text": "Get the Quillfeather revenue figure before the first screen; reviewers flagged the $40M framing twice.", "impact": "medium", "effort": "medium", "section": "pitch", "niche_id": "n02", "id": "a028"}, {"text": "Counter once, with the 75th-percentile figure and a reason; most negotiators who counter get more.", "impact": "medium", "effort": "medium", "section": "pay", "niche_id": "n02", "id": "a029"}, {"text": "Open every application with the 35-integration program and the $18M pipeline: program design and build-from-zero are required in most postings.", "impact": "medium", "effort": "medium", "section": "demand", "niche_id": "n01", "id": "a030"}, {"text": "Prepare a GSI story or a plan for one: 5 of 8 postings require systems-integrator partners and the resume has none.", "impact": "medium", "effort": "medium", "section": "demand", "niche_id": "n01", "id": "a031"}, {"text": "Mirror 'define and build the partner program' in the headline and first bullet — 'program' and 'define' are the terms most specific to this niche.", "impact": "medium", "effort": "medium", "section": "language", "niche_id": "n01", "id": "a032"}, {"text": "Close the two cheapest gaps first: surface co-sell evidence and the reporting line; both need facts, not new experience.", "impact": "medium", "effort": "medium", "section": "fit", "niche_id": "n01", "id": "a033"}, {"text": "Treat 'employer sells AI' as a targeting choice, not a resume fix: apply where the AI product sits on data infrastructure you know.", "impact": "medium", "effort": "medium", "section": "fit", "niche_id": "n01", "id": "a034"}, {"text": "Start with the five employers where the AWS ecosystem gives a strength-2 path (Botify, Profound, Conveo, Decagon, Hex).", "impact": "medium", "effort": "medium", "section": "employers", "niche_id": "n01", "id": "a035"}, {"text": "Apply on the employer's own careers page; aggregator copies of the same job were penalized for liveness.", "impact": "medium", "effort": "medium", "section": "em /* ================= stations, theme, observers ================= */
(function chrome() {
  const nav = $("[data-stations]"), ol = el("ol");
  ACTS.forEach(([id, t], i) => ol.append(el("li", {}, el("a", { href: "#" + id }, [el("b", { text: String(i + 1) }), el("span", { text: t }), el("i")]))));
  nav.append(ol);
  const links = Object.fromEntries(ACTS.map(([id]) => [id, $(`a[href="#${id}"]`, nav)]));
  const acts = ACTS.map(([id]) => document.getElementById(id));
  let cur = null;
  function update() { const y = innerHeight * .5; let now = null;
    for (const a of acts) { const r = a.getBoundingClientRect(); if (r.top <= y && r.bottom > y) { now = a; break; } }
    if (now?.id !== cur) { Object.values(links).forEach(l => l.removeAttribute("aria-current")); if (now) links[now.id].setAttribute("aria-current", "step"); cur = now?.id || null; }
    if (now) { const r = now.getBoundingClientRect(); links[now.id].style.setProperty("--p", Math.max(0, Math.min(1, (y - r.top) / r.height)).toFixed(3)); } }
  addEventListener("scroll", () => requestAnimationFrame(update), { passive: true }); addEventListener("resize", update); setTimeout(update, 50);
  const t = el("button", { class: "corner", "data-btn-solo": "", "aria-label": "Switch light or dark theme", html: '<svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg><svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>' });
  t.onclick = () => { const r = document.documentElement; r.dataset.theme = r.dataset.theme === "dark" ? "light" : "dark"; store.set("theme", r.dataset.theme); };
  const saved = store.get("theme", null); if (saved) document.documentElement.dataset.theme = saved;
  document.body.append(t);
  addEventListener("focusin", e => { if (e.target.matches("input[type=text],select,textarea")) document.body.classList.add("typing"); });
  addEventListener("focusout", () => document.body.classList.remove("typing"));
  $("#foot").textContent = `niche-lab ${R.meta.skill_version}. Data window: ${R.meta.data_window}. LinkedIn: ${R.meta.linkedin_status}. One self-contained file; nothing is sent anywhere.`;
})();
